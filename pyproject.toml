[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.pytest.ini_options]
minversion = "7.0"
# Put the repo root on sys.path so `src` and `config` import regardless of
# how pytest is invoked (`pytest` vs `python -m pytest`)
pythonpath = ["."]
# Live-network tests are opt-in: run them with `pytest -m live`
addopts = "-ra -q --strict-markers -m 'not live'"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
markers = [
    "live: marks tests as requiring live network access (deselect with '-m not live')",
]
